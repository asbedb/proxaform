---
# Low-precedence default variables (always prefix with role name)

# Package and service settings
my_role_package_name: "example-service"
my_role_service_name: "example-service"
my_role_service_state: "started"
my_role_service_enabled: true

# Configuration settings
my_role_config_dir: "/etc/example-service"
my_role_config_file: "/etc/example-service/example.conf"
my_role_port: 8080
my_role_log_level: "info"
