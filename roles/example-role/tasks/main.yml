---
# Core execution tasks (ordered: install -> configure -> start/enable)

- name: Install required package
  ansible.builtin.package:
      name: "{{ my_role_package_name }}"
      state: present

- name: Ensure configuration directory exists
  ansible.builtin.file:
      path: "{{ my_role_config_dir }}"
      state: directory
      owner: root
      group: root
      mode: "0755"

- name: Deploy configuration file
  ansible.builtin.template:
      src: "example.conf.j2"
      dest: "{{ my_role_config_file }}"
      owner: root
      group: root
      mode: "0644"
  notify: Restart my_role service

- name: Manage service state and boot enablement
  ansible.builtin.service:
      name: "{{ my_role_service_name }}"
      state: "{{ my_role_service_state }}"
      enabled: "{{ my_role_service_enabled }}"
