---
- name: Restart NTP service
  ansible.builtin.service:
      name: "{{ 'chrony' if ansible_facts['os_family'] == 'RedHat' else 'systemd-timesyncd' }}"
      state: restarted

- name: Reload systemd daemon
  ansible.builtin.systemd:
      daemon_reload: true

- name: Update CA certificates
  ansible.builtin.command:
      cmd: "{{ 'update-ca-trust' if ansible_facts['os_family'] == 'RedHat' else 'update-ca-certificates' }}"

- name: Restart SSH service
  ansible.builtin.service:
      name: "{{ 'sshd' if ansible_facts['os_family'] =='RedHat' else 'ssh' }}"
      state: restarted
