- name: Ensure Python dependencies for Docker modules are installed
  ansible.builtin.apt:
      name:
          - python3-requests
          - python3-docker
          - python3-passlib
      state: present
      update_cache: yes

- name: Create persistent Docker volume for Portainer data
  community.docker.docker_volume:
      name: "{{ portainer_volume_name }}"
      state: present

- name: Deploy Portainer Server container
  community.docker.docker_container:
      name: "{{ portainer_container_name }}"
      image: "{{ portainer_image }}"
      state: started
      restart_policy: "{{ portainer_restart_policy }}"
      command: --admin-password="{{ (portainer_admin_password | default('ChangeMe12345678!')) | password_hash('bcrypt') }}"
      published_ports:
          - "{{ portainer_http_port }}:9000"
          - "{{ portainer_https_port }}:9443"
          - "{{ portainer_edge_port }}:8000"
      volumes:
          - "{{ portainer_docker_socket }}:/var/run/docker.sock"
          - "{{ portainer_volume_name }}:/data"

- name: Resolve Portainer IP
  ansible.builtin.set_fact:
      resolved_ip: "{{ ansible_facts.default_ipv4.address }}"

- name: Wait for Portainer web service to become active
  ansible.builtin.uri:
      url: "https://127.0.0.1:{{ portainer_https_port }}"
      status_code: [200, 401, 302]
      validate_certs: false
  register: portainer_health
  until: portainer_health.status in [200, 401, 302]
  retries: 10
  delay: 3

- name: Display deployment access details
  ansible.builtin.debug:
      msg:
          - "--------------------------------------------------------"
          - "Portainer installed successfully!"
          - "Status Code: {{ portainer_health.status }}"
          - "Access URL:  https://{{ resolved_ip }}:{{ portainer_https_port }}"
          - "Admin User:  {{ portainer_admin_username | default('admin') }}"
          - "--------------------------------------------------------"
